<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your computer</title>
<style>
  body { margin: 0; background: #1C1B19; color: #F4EFE2; font: 15px/1.5 ui-monospace, Menlo, monospace; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
  h1 { font: 400 1.6rem Georgia, serif; margin: 0 0 4px; }
  p { color: #a8a294; margin: 0 0 16px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 12px; border: 1px solid #5b574d; border-radius: 8px; background: #26241f; color: inherit; font: inherit; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: #E3C98F; color: #1C1B19; font: inherit; cursor: pointer; }
</style>
<main>
  <h1 id="h">Your computer</h1>
  <p id="who"></p>
  <pre id="out"></pre>
  <form id="f"><input id="c" autocomplete="off" spellcheck="false" aria-label="Command" required><button>Run</button></form>
</main>
<script>
  let user = /(?:^|; )user=([^;]+)/.exec(document.cookie)?.[1]
  const who = document.getElementById('who'), out = document.getElementById('out'), c = document.getElementById('c')
  const signedIn = () => { who.textContent = `Signed in as ${user}. Try: echo hello > note.txt, then come back in ten minutes and cat note.txt`; c.placeholder = 'ls -la' }
  if (user) signedIn(); else { who.textContent = 'Pick a name to get a computer (lower-case letters and digits).'; c.placeholder = 'your-name' }
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault()
    const text = c.value.trim(); c.value = ''
    if (!user) {
      if (!/^[a-z0-9-]{1,32}$/.test(text)) return
      document.cookie = `user=${text}; path=/; max-age=31536000; samesite=lax`; user = text; return signedIn()
    }
    out.textContent += `$ ${text}\n`
    const r = await (await fetch('/run', { method: 'POST', body: JSON.stringify({ command: text }) })).json()
    out.textContent += r.output + (r.output.endsWith('\n') || !r.output ? '' : '\n')
    if (r.sandbox) document.getElementById('h').textContent = `Your computer · ${r.sandbox}`
    c.scrollIntoView()
  }
</script>
</html>
