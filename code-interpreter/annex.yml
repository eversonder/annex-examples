# What every code-interpreter sandbox starts with. Save it with: annex template apply
name: code-interpreter
description: Python with pandas and matplotlib
vcpu: 2
memory_gib: 4
route: cheapest
setup:
  - |
    S=; [ "$(id -u)" = 0 ] || S=sudo
    command -v pip3 >/dev/null || { $S apt-get update && $S apt-get install -y python3 python3-pip; }
  - pip3 install --break-system-packages pandas matplotlib || pip3 install pandas matplotlib
